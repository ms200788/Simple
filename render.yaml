services:
  - type: web
    name: simple-telegram-controller
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_USER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: WORKER_API_TOKEN
        generateValue: true
      - key: INTAKE_CHANNEL_ID
        sync: false
      - key: MAX_BATCH_LINKS
        value: "50"
      - key: MAX_PARALLEL_JOBS
        value: "2"
      - key: LOG_LEVEL
        value: "INFO"
